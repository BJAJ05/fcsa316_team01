# Runs on every pull request and on every push (merge) to main:
#   backend  — checks for uncommitted migrations, then runs pytest on PostgreSQL 16
#   frontend — installs exact dependencies from package-lock.json and builds the app
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only reads the code; it never writes to the repository.
permissions:
  contents: read

# Actions are pinned to v7, which runs on Node 24. The v4/v5 versions named in the
# lab sheet run on Node 20, which GitHub has deprecated.

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    # Same database engine as production. The superuser created by the image
    # can create the throwaway test database that pytest-django needs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lms_user
          POSTGRES_PASSWORD: lms-ci-only
          POSTGRES_DB: lms_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms_user -d lms_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI-only values (not secrets). These override the SQLite fallback in
    # config/settings_test.py, so the tests run on the PostgreSQL service above.
    # The key also signs JWTs: PyJWT warns about HMAC keys shorter than 32 bytes.
    env:
      DJANGO_SECRET_KEY: ci-only-insecure-key-not-a-secret-0123456789
      DB_ENGINE: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: lms_db
      DB_USER: lms_user
      DB_PASSWORD: lms-ci-only

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Fails when a model was changed but its migration was not committed.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest -v

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
